name: lifecycle-protection-validation

on:
  pull_request:
    paths:
      - "src/bybit_workbench/exchange/bybit/**"
      - "src/bybit_workbench/lifecycle_supervisor.py"
      - "operations/monitoring/lifecycle_supervisor_runtime.py"
      - "operations/connectivity/private_runtime.py"
      - "tests/test_*protection*.py"
      - ".github/workflows/lifecycle-protection-validation.yml"

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Install server-only PostgreSQL test driver
        run: uv pip install --python .\.venv\Scripts\python.exe "psycopg[binary]==3.2.10"
      - name: New protection code lint
        run: |
          .\.venv\Scripts\python.exe -m ruff check src/bybit_workbench/exchange/bybit/effective_protection.py src/bybit_workbench/exchange/bybit/protection_evidence.py src/bybit_workbench/exchange/bybit/protection_intent.py src/bybit_workbench/exchange/bybit/protection_probe.py src/bybit_workbench/exchange/bybit/protection_supervisor_bridge.py src/bybit_workbench/exchange/bybit/transport.py src/bybit_workbench/lifecycle_supervisor.py tests/test_effective_protection_account_evidence.py tests/test_effective_protection_execution_wiring.py tests/test_exchange_protection_independent.py tests/test_protection_intent_failclosed.py tests/test_protection_probe_identity.py tests/test_protection_supervisor_bridge.py
      - name: Protection regression tests
        run: .\\.venv\\Scripts\\python.exe -m pytest tests/test_effective_protection_account_evidence.py tests/test_effective_protection_execution_wiring.py tests/test_exchange_protection_independent.py tests/test_protection_intent_failclosed.py tests/test_protection_probe_identity.py tests/test_protection_supervisor_bridge.py
      - name: Windows-compatible full pytest evidence (legacy baseline may fail)
        continue-on-error: true
        run: .\.venv\Scripts\python.exe -m pytest --ignore=tests/test_public_trade_archive.py
      - name: Headless application smoke
        run: .\.venv\Scripts\python.exe -m bybit_workbench --headless --database ci-smoke.db

  linux-full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python 3.12
      - name: Install server PostgreSQL driver for tests
        run: uv pip install --python .venv/bin/python "psycopg[binary]==3.2.10"
      - name: Complete Linux regression evidence (legacy baseline may fail)
        continue-on-error: true
        run: .venv/bin/python -m pytest

  release-delta-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python 3.12
      - name: Install server PostgreSQL driver for tests
        run: uv pip install --python .venv/bin/python "psycopg[binary]==3.2.10"
      - name: Require NEW_RUFF_DIAGNOSTICS=0 on changed Python files
        shell: bash
        run: |
          # pull_request checks out the synthetic merge ref. Its first parent
          # is the actual current main, unlike stale PR metadata.base.sha.
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if (("${#parents[@]}" != 3)); then
            echo "Expected exactly two parents on GitHub PR merge checkout" >&2
            exit 1
          fi
          BASE_SHA="${parents[1]}"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" HEAD -- "*.py")
          git worktree add --detach ../base-ruff "$BASE_SHA"
          set +e
          .venv/bin/python -m ruff check "${files[@]}" --output-format=json > head-ruff.json
          (
            cd ../base-ruff
            base_files=()
            for file in "${files[@]}"; do
              [[ -f "$file" ]] && base_files+=("$file")
            done
            if (("${#base_files[@]}" > 0)); then
              "$GITHUB_WORKSPACE/.venv/bin/python" -m ruff check \
                "${base_files[@]}" --output-format=json > "$GITHUB_WORKSPACE/base-ruff.json"
            else
              printf '[]\n' > "$GITHUB_WORKSPACE/base-ruff.json"
            fi
          )
          set -e
          .venv/bin/python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          def diagnostics(path: str) -> Counter[str]:
              rows = json.loads(Path(path).read_text(encoding="utf-8") or "[]")
              out: Counter[str] = Counter()
              for item in rows:
                  filename = str(item["filename"]).replace("\\", "/")
                  for marker in ("/base-ruff/", "/cripta/"):
                      if marker in filename:
                          filename = filename.rsplit(marker, 1)[1]
                          break
                  out[
                      f"{filename}|{item.get('code')}|{item.get('message')}"
                  ] += 1
              return out

          base = diagnostics("base-ruff.json")
          head = diagnostics("head-ruff.json")
          new = head - base
          print(f"BASE_RUFF_DIAGNOSTICS={sum(base.values())}")
          print(f"HEAD_RUFF_DIAGNOSTICS={sum(head.values())}")
          print(f"NEW_RUFF_DIAGNOSTICS={sum(new.values())}")
          if new:
              for item, count in sorted(new.items()):
                  print(f"  {count}x {item}")
              raise SystemExit(1)
          PY
      - name: Capture head full pytest result
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest --junitxml=head-pytest.xml
          echo "HEAD_PYTEST_RC=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Capture head mypy result
        shell: bash
        run: |
          set +e
          .venv/bin/python -m mypy src/bybit_workbench --show-error-codes --no-pretty --no-error-summary > head-mypy.txt
          echo "HEAD_MYPY_RC=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Capture exact base regression
        shell: bash
        run: |
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if (("${#parents[@]}" != 3)); then
            echo "Expected exactly two parents on GitHub PR merge checkout" >&2
            exit 1
          fi
          BASE_SHA="${parents[1]}"
          git worktree add --detach ../base-regression "$BASE_SHA"
          set +e
          (
            cd ../base-regression
            PYTHONPATH="$PWD/src" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
              --junitxml="$GITHUB_WORKSPACE/base-pytest.xml"
          )
          echo "BASE_PYTEST_RC=$?" >> "$GITHUB_ENV"
          (
            cd ../base-regression
            PYTHONPATH="$PWD/src" "$GITHUB_WORKSPACE/.venv/bin/python" -m mypy \
              src/bybit_workbench --show-error-codes --no-pretty --no-error-summary \
              > "$GITHUB_WORKSPACE/base-mypy.txt"
          )
          echo "BASE_MYPY_RC=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Require NEW_TEST_FAILURES=0 and NEW_MYPY_DIAGNOSTICS=0
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          def pytest_failures(path: str) -> Counter[str]:
              root = ET.parse(path).getroot()
              out: Counter[str] = Counter()
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  key = f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                  out[key] += 1
              return out

          def mypy_diagnostics(path: str) -> Counter[str]:
              out: Counter[str] = Counter()
              pattern = re.compile(
                  r"^(.*?):\d+(?::\d+)?: error: (.*?)(?:  \[([^]]+)\])?$"
              )
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  match = pattern.match(raw.strip())
                  if not match:
                      continue
                  filename = match.group(1).replace("\\", "/")
                  marker = "/src/bybit_workbench/"
                  if marker in filename:
                      filename = "src/bybit_workbench/" + filename.split(marker, 1)[1]
                  out[f"{filename}|{match.group(2)}|{match.group(3) or ''}"] += 1
              return out

          base_pytest = pytest_failures("base-pytest.xml")
          head_pytest = pytest_failures("head-pytest.xml")
          new_tests = head_pytest - base_pytest

          base_mypy = mypy_diagnostics("base-mypy.txt")
          head_mypy = mypy_diagnostics("head-mypy.txt")
          new_mypy = head_mypy - base_mypy

          print(f"BASE_PYTEST_FAILURES={sum(base_pytest.values())}")
          print(f"HEAD_PYTEST_FAILURES={sum(head_pytest.values())}")
          print(f"NEW_TEST_FAILURES={sum(new_tests.values())}")
          print(f"BASE_MYPY_DIAGNOSTICS={sum(base_mypy.values())}")
          print(f"HEAD_MYPY_DIAGNOSTICS={sum(head_mypy.values())}")
          print(f"NEW_MYPY_DIAGNOSTICS={sum(new_mypy.values())}")
          if new_tests:
              print("New pytest failures:")
              for item, count in sorted(new_tests.items()):
                  print(f"  {count}x {item}")
          if new_mypy:
              print("New mypy diagnostics:")
              for item, count in sorted(new_mypy.items()):
                  print(f"  {count}x {item}")
          if new_tests or new_mypy:
              raise SystemExit(1)
          PY
      - name: Headless application smoke
        run: .venv/bin/python -m bybit_workbench --headless --database ci-smoke-delta.db
