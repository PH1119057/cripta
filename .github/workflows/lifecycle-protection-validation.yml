name: lifecycle-protection-validation

on:
  pull_request:
    paths:
      - "src/bybit_workbench/exchange/bybit/**"
      - "src/bybit_workbench/lifecycle_supervisor.py"
      - "operations/monitoring/lifecycle_supervisor_runtime.py"
      - "operations/connectivity/private_runtime.py"
      - "tests/test_*protection*.py"
      - ".github/workflows/lifecycle-protection-validation.yml"

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: New protection code lint
        run: |
          .\.venv\Scripts\python.exe -m ruff check src/bybit_workbench/exchange/bybit/effective_protection.py src/bybit_workbench/exchange/bybit/protection_evidence.py src/bybit_workbench/exchange/bybit/protection_intent.py src/bybit_workbench/exchange/bybit/protection_probe.py src/bybit_workbench/exchange/bybit/protection_supervisor_bridge.py src/bybit_workbench/exchange/bybit/transport.py src/bybit_workbench/lifecycle_supervisor.py tests/test_effective_protection_account_evidence.py tests/test_effective_protection_execution_wiring.py tests/test_exchange_protection_independent.py tests/test_protection_intent_failclosed.py tests/test_protection_probe_identity.py tests/test_protection_supervisor_bridge.py
      - name: Protection regression tests
        run: .\\.venv\\Scripts\\python.exe -m pytest tests/test_effective_protection_account_evidence.py tests/test_effective_protection_execution_wiring.py tests/test_exchange_protection_independent.py tests/test_protection_intent_failclosed.py tests/test_protection_probe_identity.py tests/test_protection_supervisor_bridge.py
      - name: Full pytest independent of historical repository lint debt
        run: .\.venv\Scripts\python.exe -m pytest
      - name: Headless application smoke
        run: .\.venv\Scripts\python.exe -m bybit_workbench --headless --database ci-smoke.db
