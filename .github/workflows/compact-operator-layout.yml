name: compact-operator-layout
on:
  push:
    paths:
      - operations/dashboard/index.html
      - tests/test_dashboard_compact_operator_layout.py
      - .github/workflows/compact-operator-layout.yml
  pull_request:
    paths:
      - operations/dashboard/index.html
      - tests/test_dashboard_compact_operator_layout.py
      - .github/workflows/compact-operator-layout.yml
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run UI checks
        run: |
          python -m pip install pytest ruff
          python -m ruff check tests/test_dashboard_compact_operator_layout.py
          python -m pytest -q tests/test_dashboard_compact_operator_layout.py
          python - <<'PY'
          from pathlib import Path
          import re
          raw = Path('operations/dashboard/index.html').read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', raw, flags=re.S)
          assert len(scripts) == 1
          Path('/tmp/dashboard-operator.js').write_text(scripts[0])
          PY
          node --check /tmp/dashboard-operator.js
