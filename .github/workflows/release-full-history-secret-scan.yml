name: release-full-history-secret-scan

on:
  pull_request:
    paths:
      - '.github/workflows/release-full-history-secret-scan.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-all-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with complete history and no retained token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include all remotely available Git branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-list --all --count

      - name: Download and SHA256-verify Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -Eeuo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-verified"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output "$checksums" "$release/$checksums"
          awk -v name="$archive" '$2 == name {print; found=1} END {if (!found) exit 1}' "$checksums" > selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "$archive" gitleaks
          chmod 0755 gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan full history and working tree, printing only safe finding metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gitleaks git --redact --no-banner --log-opts='--all' \
            --report-format=json --report-path="$RUNNER_TEMP/history.json" .
          history_status=$?
          gitleaks dir --redact --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/worktree.json" .
          worktree_status=$?
          set -e
          python3 - "$RUNNER_TEMP/history.json" "$RUNNER_TEMP/worktree.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          def public_token(value, limit=130):
              return re.sub(r"[^A-Za-z0-9_./-]", "?", str(value))[:limit]

          for scope, filename in zip(("HISTORY", "CURRENT"), sys.argv[1:]):
              path = pathlib.Path(filename)
              data = json.loads(path.read_text()) if path.is_file() else []
              print(f"{scope}_POTENTIAL_SECRET_COUNT={len(data)}")
              for item in data:
                  print(
                      f"{scope}_POTENTIAL_SECRET "
                      f"rule={public_token(item.get('RuleID', ''))} "
                      f"path={public_token(item.get('File', ''))} "
                      f"line={int(item.get('StartLine') or 0)} "
                      f"commit={public_token(item.get('Commit', ''), 12)} "
                      f"fingerprint={public_token(item.get('Fingerprint', ''), 250)}"
                  )
          PY
          if (( history_status != 0 || worktree_status != 0 )); then
            echo "RELEASE_SECRET_SCAN=BLOCKED"
            exit 1
          fi
          echo "RELEASE_SECRET_SCAN=PASS"
