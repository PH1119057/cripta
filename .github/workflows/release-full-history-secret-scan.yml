name: release-full-history-secret-scan

on:
  pull_request:
    paths:
      - '.github/workflows/release-full-history-secret-scan.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-all-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with complete history and no retained token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include all remotely available Git branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-list --all --count

      - name: Download and SHA256-verify Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -Eeuo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-verified"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output "$checksums" "$release/$checksums"
          awk -v name="$archive" '$2 == name {print; found=1} END {if (!found) exit 1}' "$checksums" > selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "$archive" gitleaks
          chmod 0755 gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan every reachable Git-history ref (redacted output only)
        shell: bash
        run: |
          set -Eeuo pipefail
          gitleaks git --redact --no-banner --log-opts='--all' .

      - name: Scan current working-tree paths including historical directories
        shell: bash
        run: |
          set -Eeuo pipefail
          gitleaks dir --redact --no-banner .
