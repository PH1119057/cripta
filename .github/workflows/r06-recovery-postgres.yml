name: r06-recovery-postgres
on:
  pull_request:
    paths:
      - "operations/monitoring/r06*"
      - "operations/sql/20261112_r06*"
      - "tests/test_r06*"
      - ".github/workflows/r06-recovery-postgres.yml"
jobs:
  exact-runtime-acl-and-atomic-resume:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: r06_recovery_ci
          POSTGRES_PASSWORD: disposable_r06_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d r06_recovery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CRIPTA_R06_RECOVERY_TEST_DSN: "postgresql://postgres:disposable_r06_ci_only@127.0.0.1:5432/r06_recovery_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv pip install --python .venv/bin/python "psycopg[binary]==3.2.10"
      - run: .venv/bin/python -m pytest -q tests/test_r06_release_bridge_postgres.py tests/test_r06_pinned_seed_470.py tests/test_r06_scoped_resume_470.py tests/test_r06_pg_only_entry_runtime_470.py
