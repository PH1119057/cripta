name: workstream-boundary

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    steps:
      # SECURITY: trusted default-branch code ONLY. Never checkout / execute PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Self-test canonical scope policy
        run: node --test .github/scripts/workstream-scope.test.js
      - name: Validate complete PR changeset
        uses: actions/github-script@v7
        with:
          script: |
            const guard = require('./.github/scripts/workstream-scope.js');
            await guard.checkPullRequest({github, context, core});
