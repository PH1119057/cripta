name: r1-prearm-parity-attestation
on:
  push:
    paths:
      - operations/dashboard/app.py
      - operations/monitoring/universal_entry_shadow.py
      - src/bybit_workbench/universal_entry/**
      - src/bybit_workbench/universal_exit/**
      - tests/test_r1_prearm_attested_observer_sha.py
      - tests/test_r1_independent_parity.py
      - tests/test_dashboard_r1_prearm_evidence.py
      - .github/workflows/r1-prearm-parity-attestation.yml
  pull_request:
    paths:
      - operations/dashboard/app.py
      - operations/monitoring/universal_entry_shadow.py
      - src/bybit_workbench/universal_entry/**
      - src/bybit_workbench/universal_exit/**
      - tests/test_r1_prearm_attested_observer_sha.py
      - tests/test_r1_independent_parity.py
      - tests/test_dashboard_r1_prearm_evidence.py
      - .github/workflows/r1-prearm-parity-attestation.yml
permissions:
  contents: read
jobs:
  attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python 3.12
      - name: Independent R1 decision parity and fail-closed negative controls
        run: |
          .venv/bin/python -m compileall -q operations/dashboard/app.py src/bybit_workbench/universal_entry/r1_independent_parity.py
          .venv/bin/python -m ruff check src/bybit_workbench/universal_entry/r1_independent_parity.py tests/test_r1_independent_parity.py tests/test_r1_prearm_attested_observer_sha.py
          .venv/bin/python -m pytest -q tests/test_r1_prearm_attested_observer_sha.py tests/test_r1_independent_parity.py tests/test_dashboard_r1_prearm_evidence.py
