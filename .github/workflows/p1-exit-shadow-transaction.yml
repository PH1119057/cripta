name: p1-exit-shadow-transaction
on:
  push:
    paths:
      - "operations/monitoring/universal_exit_shadow_runtime.py"
      - "tests/test_p1_exit_shadow_transaction_boundary.py"
      - ".github/workflows/p1-exit-shadow-transaction.yml"
  pull_request:
    paths:
      - "operations/monitoring/universal_exit_shadow_runtime.py"
      - "tests/test_p1_exit_shadow_transaction_boundary.py"
      - ".github/workflows/p1-exit-shadow-transaction.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Syntax and regression
        run: |
          python -m py_compile operations/monitoring/universal_exit_shadow_runtime.py
          python -m ruff check tests/test_p1_exit_shadow_transaction_boundary.py
          python -m pytest -q tests/test_p1_exit_shadow_transaction_boundary.py
