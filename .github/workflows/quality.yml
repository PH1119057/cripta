name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: .\.venv\Scripts\python.exe -m ruff check src tests
      - run: .\.venv\Scripts\python.exe -m mypy src/bybit_workbench
      - name: Install server PostgreSQL test driver
        run: uv pip install --python .\.venv\Scripts\python.exe "psycopg[binary]==3.2.10"
      # POSIX-only fcntl archive is covered by the dedicated Linux job below.
      - run: .\.venv\Scripts\python.exe -m pytest --ignore=tests/test_public_trade_archive.py
      - run: .\.venv\Scripts\python.exe -m bybit_workbench --headless --database ci-smoke.db

  unix-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python 3.12
      - run: .venv/bin/python -m pytest tests/test_public_trade_archive.py
