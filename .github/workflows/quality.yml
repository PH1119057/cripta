name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: .\.venv\Scripts\python.exe --version
      - run: .\.venv\Scripts\python.exe -m py_compile research/server/monitoring/opportunity_tracker.py
      - run: .\.venv\Scripts\python.exe -m ruff check src tests
      - run: .\.venv\Scripts\python.exe -m mypy src/bybit_workbench
      - run: .\.venv\Scripts\python.exe -m pytest
      - run: .\.venv\Scripts\python.exe -m bybit_workbench --headless --database ci-smoke.db
