name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run python -m ruff check src tests
      - run: uv run python -m mypy src/bybit_workbench
      - run: uv run python -m pytest
      - run: uv run python -m bybit_workbench --headless --database ci-smoke.db
