name: release-arm-guard
on:
  push:
    paths:
      - "src/bybit_workbench/live_release_alert.py"
      - "src/bybit_workbench/release_arm_safety.py"
      - "tests/test_live_release_alert.py"
      - "tests/test_release_arm_safety.py"
      - "tests/test_release_arm_postgres.py"
      - "tests/test_release_arm_deploy_contract.py"
      - "tests/test_dashboard_release_arm_scope.py"
      - "operations/infrastructure/deploy_dashboard_ui.sh"
      - "operations/dashboard/index.html"
      - "operations/dashboard/app.py"
      - "operations/connectivity/universal_entry_consumer.py"
      - "operations/infrastructure/cripta-apply-incoming"
      - "operations/sql/20261009_release_arm_incidents.sql"
      - ".github/workflows/release-arm-guard.yml"
  pull_request:
    paths:
      - "src/bybit_workbench/live_release_alert.py"
      - "src/bybit_workbench/release_arm_safety.py"
      - "tests/test_live_release_alert.py"
      - "tests/test_release_arm_safety.py"
      - "tests/test_release_arm_postgres.py"
      - "tests/test_release_arm_deploy_contract.py"
      - "tests/test_dashboard_release_arm_scope.py"
      - "operations/infrastructure/deploy_dashboard_ui.sh"
      - "operations/dashboard/index.html"
      - "operations/dashboard/app.py"
      - "operations/connectivity/universal_entry_consumer.py"
      - "operations/infrastructure/cripta-apply-incoming"
      - "operations/sql/20261009_release_arm_incidents.sql"
      - ".github/workflows/release-arm-guard.yml"
jobs:
  targeted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --all-extras --python 3.12
          # Disposable PostgreSQL test dependency, pinned to current runtime ABI.
          uv pip install --python .venv/bin/python "psycopg[binary]==3.1.17"
      - name: Exact new-code lint
        run: |
          .venv/bin/python -m ruff check src/bybit_workbench/live_release_alert.py src/bybit_workbench/release_arm_safety.py tests/test_live_release_alert.py tests/test_release_arm_safety.py tests/test_release_arm_postgres.py tests/test_release_arm_deploy_contract.py tests/test_dashboard_release_arm_scope.py
      - name: Release-arm regression and disposable PostgreSQL
        env:
          TEST_DASHBOARD_BASE_COMMIT: 57c4639c1de1df86e0f6ffd4de024e8821ca535e
          TEST_RELEASE_ARM_PG_DSN: host=localhost port=5432 dbname=postgres user=postgres password=synthetic_test_password
        run: |
          .venv/bin/python -m pytest -q tests/test_live_release_alert.py tests/test_release_arm_safety.py tests/test_release_arm_postgres.py tests/test_release_arm_deploy_contract.py
      - name: Full pytest baseline diagnostic
        continue-on-error: true
        run: |
          set +e
          .venv/bin/python -m pytest -q --tb=short > /tmp/release-full-pytest.log 2>&1
          rc=$?
          echo "FULL_PYTEST_RC=$rc"
          tail -n 130 /tmp/release-full-pytest.log
          exit "$rc"
      - name: Python and release bash syntax
        run: |
          .venv/bin/python -m py_compile operations/dashboard/app.py operations/connectivity/universal_entry_consumer.py src/bybit_workbench/release_arm_safety.py
          bash -n operations/infrastructure/cripta-apply-incoming operations/infrastructure/install_verified_release.sh
      - name: Dashboard JavaScript syntax
        run: |
          .venv/bin/python -c "from pathlib import Path; s=Path('operations/dashboard/index.html').read_text(); Path('/tmp/release-dashboard.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/release-dashboard.js
