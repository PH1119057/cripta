name: r1-structural-exit-tp
on:
  push:
    paths:
      - "operations/monitoring/universal_exit_shadow_runtime.py"
      - "operations/connectivity/private_runtime.py"
      - "docs/TRADING_CONTOUR_RU.md"
      - "docs/DOCUMENTATION_INDEX_RU.md"
      - "tests/test_r1_exit_structural_tp_tick.py"
      - ".github/workflows/r1-structural-exit-tp.yml"
  pull_request:
    paths:
      - "operations/monitoring/universal_exit_shadow_runtime.py"
      - "operations/connectivity/private_runtime.py"
      - "docs/TRADING_CONTOUR_RU.md"
      - "docs/DOCUMENTATION_INDEX_RU.md"
      - "tests/test_r1_exit_structural_tp_tick.py"
      - ".github/workflows/r1-structural-exit-tp.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest ruff
      - name: Code syntax
        run: |
          python -m py_compile operations/monitoring/universal_exit_shadow_runtime.py operations/connectivity/private_runtime.py
          python -m ruff check tests/test_r1_exit_structural_tp_tick.py
      - name: Focused regression
        run: python -m pytest -q tests/test_r1_exit_structural_tp_tick.py
