name: observer-lifecycle-race
on:
  push:
    paths:
      - "operations/monitoring/universal_entry_shadow.py"
      - "src/bybit_workbench/lifecycle_supervisor.py"
      - "tests/test_observer_worker_thread_cleanup.py"
      - "tests/test_exit_owner_heartbeat_clock_race.py"
      - ".github/workflows/observer-lifecycle-race.yml"
  pull_request:
    paths:
      - "operations/monitoring/universal_entry_shadow.py"
      - "src/bybit_workbench/lifecycle_supervisor.py"
      - "tests/test_observer_worker_thread_cleanup.py"
      - "tests/test_exit_owner_heartbeat_clock_race.py"
      - ".github/workflows/observer-lifecycle-race.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks
        run: python -m pip install pytest ruff psycopg[binary]
      - name: Check syntax and regression contracts
        run: |
          python -m compileall -q src/bybit_workbench/lifecycle_supervisor.py operations/monitoring/universal_entry_shadow.py
          python -m ruff check tests/test_exit_owner_heartbeat_clock_race.py tests/test_observer_worker_thread_cleanup.py src/bybit_workbench/lifecycle_supervisor.py
          python -m pytest -q tests/test_exit_owner_heartbeat_clock_race.py tests/test_observer_worker_thread_cleanup.py
