name: dashboard-symmetric-workspace
on:
  push:
    paths:
      - "operations/dashboard/index.html"
      - "tests/test_dashboard_symmetric_workspace.py"
      - ".github/workflows/dashboard-symmetric-workspace.yml"
  pull_request:
    paths:
      - "operations/dashboard/index.html"
      - "tests/test_dashboard_symmetric_workspace.py"
      - ".github/workflows/dashboard-symmetric-workspace.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks
        run: python -m pip install pytest ruff
      - name: Check script syntax and UI invariants
        run: |
          python -m ruff check tests/test_dashboard_symmetric_workspace.py
          python -m pytest -q tests/test_dashboard_symmetric_workspace.py
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('operations/dashboard/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',raw,re.S)
          assert len(scripts)==1
          Path('/tmp/cripta-dashboard-script.js').write_text(scripts[0])
          PY
          node --check /tmp/cripta-dashboard-script.js
